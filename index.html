<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;padding:16px}
.card{max-width:540px;margin:0 auto;border:2.5px solid #FFC400;border-radius:26px;padding:26px;background:#151515;text-align:center}
.avatar{width:135px;height:135px;border-radius:50%;border:3.5px solid #FFC400;object-fit:cover;margin:0 auto;display:block}
h1{color:#FFC400;margin:16px 0 8px;font-size:32px;letter-spacing:2px}
.tag{background:#FFC400;color:#000;padding:7px 16px;border-radius:20px;font-weight:900;font-size:13px;display:inline-block}
.bio{color:#ccc;margin:16px 0 0;line-height:1.6;font-size:15px}
.nav{display:flex;justify-content:center;gap:10px;margin:18px auto;max-width:540px}
.nav button{background:#151515;border:1px solid #FFC400;color:#FFC400;padding:10px 18px;border-radius:20px;font-weight:700;cursor:pointer}
.nav button.active{background:#FFC400;color:#000}
.dashboard{max-width:540px;margin:0 auto 18px;background:#151515;border:1px solid #FFC400;border-radius:18px;padding:18px;display:none}
.dashboard h3{color:#FFC400;margin-bottom:12px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:14px}
.poem-wrap{max-width:540px;margin:22px auto;border:1px solid #2a2a2a;border-radius:18px;padding:20px;background:#151515}
.poem-text{white-space:pre-wrap;line-height:1.7;font-size:15px;color:#eee}
.actions{display:flex;gap:18px;margin-top:16px;border-top:1px solid #222;padding-top:12px;font-size:14px}
.act{cursor:pointer;display:flex;align-items:center;gap:6px}
.act:hover{color:#FFC400}
.act.liked{color:#FFC400}
.comment-box{margin-top:12px;display:none}
