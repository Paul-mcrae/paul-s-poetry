<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAUL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;padding-bottom:60px}
header{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}header b span{color:#f5c518}
.btn{padding:10px 16px;border-radius:25px;font-weight:800;font-size:13px;text-decoration:none;display:inline-block}.btn-gold{background:#f5c518;color:#000}.btn-dark{background:#222;color:#fff;border:1px solid #555}
.about{border:2px solid #f5c518;border-radius:20px;margin:12px;padding:20px;text-align:center;background:#121212}.about img{width:110px;height:110px;border-radius:50%;border:3px solid #f5c518;object-fit:cover;background:#222}
.card{background:#121212;border:1px solid #222;border-radius:14px;padding:14px;margin:12px}.card h3{color:#f5c518}.card p{white-space:pre-line;line-height:1.7;color:#ddd;font-size:14px;margin-top:6px}.card p.short{max-height:80px;overflow:hidden}.read{color:#f5c518;background:#1a1a1a;border:1px solid #333;padding:6px 12px;border-radius:20px;margin-top:8px;font-size:12px}
.acts{display:flex;gap:6px;margin-top:12px;border-top:1px solid #222;padding-top:10px}.acts button{background:#222;border:1px solid #333;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px}.acts button.liked{background:#f5c518;color:#000}
.cBox{display:none;margin-top:10px;border-top:1px solid #222;padding-top:10px}.cBox input{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px}.cBox button{margin-top:6px;background:#f5c518;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:700;font-size:12px}.cItem{background:#1a1a1a;border-left:2px solid #f5c518;padding:7px 10px;border-radius:8px;margin-top:6px;font-size:13px;color:#ccc}
#shareM{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}.shareBox{background:#111;border:2px solid #f5c518;border-radius:20px;padding:20px;max-width:340px;width:100%;text-align:center}.shareBox a,.shareBox button{display:block;width:100%;margin:8px 0;padding:12px;border-radius:25px;text-decoration:none;font-weight:700;font-size:14px;border:none}.wa{background:#25D366;color:#fff}.fb{background:#1877F2;color:#fff}.x{background:#fff;color:#000}.cp{background:#222;color:#f5c518;border:1px solid #f5c518}
#admin{position:fixed;inset:0;background:#000;z-index:9999;display:none;overflow:auto}
</style></head><body>

<header><b><span>PAUL'S</span> POETRY</b><div style="display:flex;gap:8px"><a class="btn btn-dark" href="#" onclick="document.getElementById('admin').style.display='block';return false">🔒 Admin</a><a class="btn btn-gold" href="https://wa.me/256709478798">WhatsApp</a></div></header>

<div class="about"><img src="paul.jpg" onerror="this.src='paul_final.jpg'"><h2 style="color:#f5c518;margin-top:8px">PAUL</h2><div style="background:#f5c518;color:#000;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;margin:8px 0">KYOTERA POET • READER IN THE FIELD</div><p style="color:#ccc;font-size:14px;text-align:left;margin-top:10px">I am Paul, 20 years, Kyotera Uganda. Real Ugandan love poems about small things.</p></div>

<h2 style="padding:16px">My Poems 🔥 <span id="pc">10</span></h2>
<div id="poems"></div>

<div id="shareM" onclick="if(event.target==this)this.style.display='none'"><div class="shareBox"><h3 style="color:#f5c518">Share Poem</h3><a id="sWA" class="wa" target="_blank">WhatsApp</a><a id="sFB" class="fb" target="_blank">Facebook</a><a id="sX" class="x" target="_blank">X / Twitter</a><button class="cp" onclick="copyL()">Copy Link</button><button onclick="document.getElementById('shareM').style.display='none'" style="background:#222;color:#aaa;border:1px solid #333">Close</button></div></div>

<div id="admin">
<div style="padding:12px;background:#111;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:1px solid #222"><b>ADMIN</b><button onclick="document.getElementById('admin').style.display='none'" style="background:#222;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:20px">✕ Close</button></div>
<div style="padding:12px"><div class="card"><h3>Add Poem</h3><input id="t" placeholder="Title" style="width:100%;padding:12px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px;margin-top:8px"><textarea id="b" placeholder="Poem..." style="width:100%;height:120px;padding:12px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px;margin-top:8px"></textarea><button onclick="addP()" style="width:100%;padding:12px;background:#f5c518;color:#000;border:none;border-radius:25px;font-weight:900;margin-top:10px">PUBLISH</button></div></div>
</div>

<script>
var poems=[
["THE COFFEE WE SHARE","I wake before the kettle sings your name,\nThe kitchen cold without your sleepy light,\nI measure two spoons just the same,\nOne strong for you, one soft and light.\n\nYou shuffle in, your hair a tangled crown,\nYou steal my mug and never put it down,\nAnd suddenly the day is warmer than the coffee."],
["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it,\nNot perfect, but with care in each crease,\nAs if you are telling them peace,\nStay here, he will be back."],
["YOUR KEYS ON MY TABLE","Your keys land loud on my table,\nA jingle that means you are home,\nJust metal music, you have roamed,\nBack to where you belong."],
["GROCERY LIST LOVE","We write our grocery list on the back of bills,\nYour handwriting big, mine cramped and small,\nMilk, bread, eggs, and your little frills."],
["WE COOK UGLY RICE","We cook rice that always sticks a bit,\nYou say it is my heat, I say it is your pot,\nBut perfect evenings we have."],
["THE DISHES AT MIDNIGHT","We do dishes at midnight again,\nBecause we procrastinated all day,\nPlates stacked like our maybe and when."],
["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel and day-old sweat,\nYour head finds my shoulder, heavy, yet,\nLight as permission to be near."],
["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two,\nWe walk like crabs, shoulder to shoulder,\nWe both get wet, but never let go."],
["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning,\nNot asking, just wearing it like it is yours,\nAnd you are right, it does."],
["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent,\nYou roll your eyes and plug it in,\nYou charge my chaos with your calm."]
];

function render(){
 var extra=[]; try{extra=JSON.parse(localStorage.getItem('paul_poems')||'[]')}catch(e){extra=[]}
 var all=extra.concat(poems);
 document.getElementById('pc').innerHTML=all.length;
 var h='';
 for(var i=0;i<all.length;i++){
  var title=all[i][0]; var body=all[i][1];
  var likes=localStorage.getItem('like_'+i)||0;
  var liked=localStorage.getItem('liked_'+i)=='1' ? ' liked' : '';
  var short=body.length>120 ? ' short' : '';
  h+='<div class="card"><h3>'+title+'</h3><p id="p'+i+'" class="'+short+'">'+body+'</p>';
  if(body.length>120) h+='<button class="read" onclick="var e=document.getElementById(\'p'+i+'\'); e.classList.toggle(\'short\'); this.innerText=e.classList.contains(\'short\')?\'Read full poem →\':\'Show less ↑\'">Read full poem →</button>';
  h+='<div class="acts"><button id="like'+i+'" class="'+liked+'" onclick="likeP('+i+')">❤️ Like '+likes+'</button><button onclick="shareP('+i+')">↗️ Share</button><button onclick="togC('+i+')">💬 Comment</button></div>';
  h+='<div id="cBox'+i+'" class="cBox"><input id="cIn'+i+'" placeholder="Write a comment..."><button onclick="postC('+i+')">Post</button><div id="cList'+i+'"></div></div></div>';
 }
 document.getElementById('poems').innerHTML=h;
 loadC();
}
function likeP(i){
 if(localStorage.getItem('liked_'+i)=='1'){alert('You already liked ❤️'); return;}
 localStorage.setItem('liked_'+i,'1');
 var v=parseInt(localStorage.getItem('like_'+i)||'0')+1;
 localStorage.setItem('like_'+i,v);
 var el=document.getElementById('like'+i); if(el){el.innerText='❤️ Liked '+v; el.classList.add('liked')}
}
function togC(i){var e=document.getElementById('cBox'+i); e.style.display=e.style.display=='block'?'none':'block';}
function postC(i){
 var inp=document.getElementById('cIn'+i); var txt=inp.value.trim(); if(!txt) return;
 var key='com_'+i; var arr=[]; try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){} arr.push(txt);
 localStorage.setItem(key,JSON.stringify(arr)); inp.value=''; loadC();
}
function loadC(){
 var extra=[]; try{extra=JSON.parse(localStorage.getItem('paul_poems')||'[]')}catch(e){}
 var all=extra.concat(poems);
 for(var j=0;j<all.length;j++){
  var key='com_'+j; var arr=[]; try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  var el=document.getElementById('cList'+j); if(!el) continue;
  var h=''; for(var k=0;k<arr.length;k++) h+='<div class="cItem">💬 '+arr[k]+'</div>';
  el.innerHTML=h;
 }
}
var curUrl='';
function shareP(i){
 var all=[]; try{all=JSON.parse(localStorage.getItem('paul_poems')||'[]')}catch(e){} all=all.concat(poems);
 var title=all[i][0]; var url='https://paul-mcrae.github.io/paul-s-poetry/'; curUrl=url;
 var text=title+' - '+url; var encT=encodeURIComponent(text); var encU=encodeURIComponent(url);
 document.getElementById('sWA').href='https://wa.me/?text='+encT;
 document.getElementById('sFB').href='https://www.facebook.com/sharer/sharer.php?u='+encU;
 document.getElementById('sX').href='https://twitter.com/intent/tweet?text='+encT;
 if(navigator.share){navigator.share({title:title,text:text,url:url}).catch(function(){document.getElementById('shareM').style.display='flex'})} else {document.getElementById('shareM').style.display='flex'}
}
function copyL(){try{navigator.clipboard.writeText(curUrl); alert('Link copied!')}catch(e){prompt('Copy:',curUrl)}}
function addP(){
 var t=document.getElementById('t').value.trim(); var b=document.getElementById('b').value.trim(); if(!t||!b){alert('Fill both'); return;}
 var arr=[]; try{arr=JSON.parse(localStorage.getItem('paul_poems')||'[]')}catch(e){}
 arr.unshift([t,b]); localStorage.setItem('paul_poems',JSON.stringify(arr)); document.getElementById('t').value=''; document.getElementById('b').value=''; alert('Published!'); render();
}
render();
</script></body></html>
